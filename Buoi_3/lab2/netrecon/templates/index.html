{% extends 'layout.html' %}
{% block content %}
<p>Nhập IP của máy trong mạng thực hành mà bạn được phép kiểm tra.</p>
<form method="post" action="{{ url_for('scan') }}" id="scan-form">
  <label for="target">Target IP</label>
  <input id="target" type="text" name="target" value="127.0.0.1" placeholder="Ví dụ: 192.168.1.10" aria-describedby="target-help" autocomplete="off" spellcheck="false" required>
  <small id="target-help">Mỗi lần chỉ nhập một IP, ví dụ 127.0.0.1 hoặc 10.12.21.116. Không nhập http://, tên miền hoặc :số_cổng; nhập cổng ở ô Ports.</small>
  <label for="ports">Ports (phân cách bằng dấu phẩy hoặc khoảng)</label>
  <input id="ports" name="ports" value="22,80,443" required>
  <label for="mode">Mode</label>
  <select id="mode" name="mode">
    <option value="all">All</option>
    <option value="scan">Port Scan (TCP)</option>
    <option value="service">Service Detection</option>
    <option value="banner">Banner Grab</option>
    <option value="map">Network Map (ARP)</option>
    <option value="vuln">Vulnerability Check</option>
  </select>
  <label for="rate_limit">Giới hạn kết nối mỗi giây</label>
  <input id="rate_limit" name="rate_limit" type="number" min="0.1" max="100" step="0.1" value="10" required>
  <label for="whitelist">Whitelist (IP cách nhau bằng khoảng trắng, để trống cho phép tất cả)</label>
  <input id="whitelist" name="whitelist" placeholder="Để trống hoặc nhập IP, ví dụ 127.0.0.1" autocomplete="off">
  <label for="blacklist">Blacklist (IP cách nhau bằng khoảng trắng)</label>
  <input id="blacklist" name="blacklist" placeholder="Để trống hoặc nhập IP cần chặn, ví dụ 192.168.1.10" autocomplete="off">
  <label for="email">Email nhận kết quả</label>
  <input id="email" type="email" name="email" value="{{ default_email }}" required>
  <button type="submit">Scan</button>
</form>
<div id="results" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
{% endblock %}
