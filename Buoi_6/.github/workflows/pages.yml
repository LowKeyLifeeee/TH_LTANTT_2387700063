name: Build and deploy Docusaurus

on:
  push:
    branches: [main]
    paths: ['Buoi_6/**', '.github/workflows/lab-06-*.yml']
  pull_request:
    branches: [main]
    paths: ['Buoi_6/**', '.github/workflows/lab-06-*.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Buoi_6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Buoi_6/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set Pages URL
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "$owner.github.io" ]; then
            echo "PAGES_URL=https://$owner.github.io/" >> "$GITHUB_ENV"
          else
            echo "PAGES_URL=https://$owner.github.io/$repo/" >> "$GITHUB_ENV"
          fi
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Buoi_6/build
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
